dependencies {
    // Mongo
    api('org.litote.kmongo:kmongo:5.12.0') {
        exclude group: "org.mongodb", module: "mongodb-driver-sync"
        exclude group: "org.mongodb", module: "mongodb-driver-core"
    }
    api 'org.mongodb:mongodb-driver-core:5.13.0'
    api 'org.mongodb:mongodb-driver-sync:5.13.0'

    // LSD
    api 'io.github.lsd-consulting:lsd-distributed-connector:3.0.0'
    implementation 'io.github.lsd-consulting:lsd-logging-library:3.0.0'

    // Spring
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:4.1.1'

    // Other
    implementation 'org.apache.httpcomponents:httpcore:4.4.16' // Needed for DB connection security
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.slf4j:slf4j-api:2.0.20'
}
